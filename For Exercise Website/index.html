<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Grade Calculator</h1>

    <form id="grade-form" novalidate>
      <label for="student-name">Student name</label>
      <input type="text" id="student-name" placeholder="e.g. Juan Dela Cruz">

      <div class="quarters">
        <div>
          <label for="q1">Q1</label>
          <input type="number" id="q1" min="0" max="100" step="any">
        </div>
        <div>
          <label for="q2">Q2</label>
          <input type="number" id="q2" min="0" max="100" step="any">
        </div>
        <div>
          <label for="q3">Q3</label>
          <input type="number" id="q3" min="0" max="100" step="any">
        </div>
        <div>
          <label for="q4">Q4</label>
          <input type="number" id="q4" min="0" max="100" step="any">
        </div>
      </div>

      <div class="buttons">
        <button type="submit" id="compute-btn">Compute</button>
        <button type="button" id="clear-btn" class="secondary">Clear</button>
      </div>
    </form>

    <p id="result" class="result" aria-live="polite"></p>
  </main>

  <script src="js/grades.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
